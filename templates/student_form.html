{% extends 'base.html' %}{% block body %}<div class="pagehead"><div><span class="eyebrow">ADMINISTRATION / STUDENT RECORD</span><h1>{{mode}} student</h1><p>Administrator can maintain identity and academic profile fields.</p></div></div><form method="post" class="formcard"><div class="formgrid"><div><label>Full name *</label><input name="full_name" required value="{{student.full_name if student else ''}}"></div><div><label>Student ID *</label><input name="student_no" required value="{{student.student_no if student else ''}}"></div><div><label>Username *</label><input name="username" required value="{{student.username if student else ''}}"></div>{% if not student %}<div><label>Initial password * (8+ characters)</label><input name="password" type="password" minlength="8" required></div>{% endif %}<div><label>Email</label><input name="email" type="email" value="{{student.email if student else ''}}"></div><div><label>Phone</label><input name="phone" value="{{student.phone if student else ''}}"></div><div><label>Department</label><input name="department" value="{{student.department if student else ''}}"></div><div><label>Semester</label><input name="semester" value="{{student.semester if student else ''}}"></div></div><div class="formactions"><button class="primary">Save student</button><a href="{{url_for('student_list')}}">Cancel</a></div></form>{% endblock %}
