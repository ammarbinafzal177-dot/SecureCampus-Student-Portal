{% extends 'base.html' %}{% block body %}<div class="pagehead"><div><span class="eyebrow">SECURITY / AUDIT TRAIL</span><h1>Security audit</h1><p>Recent account and administrative actions.</p></div></div><div class="tablewrap"><table><thead><tr><th>TIME</th><th>ACTOR</th><th>EVENT</th><th>DETAIL</th></tr></thead><tbody>{% for l in logs %}<tr><td>{{l.created_at}}</td><td>{{l.actor}}</td><td><span class="pill">{{l.action}}</span></td><td>{{l.detail}}</td></tr>{% else %}<tr><td colspan="4" class="empty">No audit events yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
