{% extends 'base.html' %}{% block body %}<div class="pagehead"><div><span class="eyebrow">STUDENT / MY PROFILE</span><h1>Personal information</h1><p>You can update your contact details. Academic identity fields are managed by admin.</p></div></div><form method="post" class="formcard"><div class="formgrid"><div><label>Full name</label><input name="full_name" required value="{{student.full_name}}"></div><div><label>Email</label><input name="email" type="email" value="{{student.email}}"></div><div><label>Phone</label><input name="phone" value="{{student.phone}}"></div><div><label>Student ID (admin managed)</label><input disabled value="{{student.student_no}}"></div><div><label>Department (admin managed)</label><input disabled value="{{student.department}}"></div><div><label>Semester (admin managed)</label><input disabled value="{{student.semester}}"></div></div><button class="primary">Update profile</button></form>{% endblock %}
